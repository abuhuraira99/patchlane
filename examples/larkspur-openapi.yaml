openapi: 3.0.3
info:
  title: Larkspur Lending API
  version: 2.4.0
servers:
  - url: https://api.larkspur.example/v2
  - url: http://staging-api.larkspur.example/v2
paths:
  /v2/loans/{loanId}:
    get:
      operationId: getLoan
      summary: Read one loan
      security:
        - bearer: [loans:read]
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: The loan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
  /v1/loans/{loanId}:
    get:
      operationId: getLoanV1
      deprecated: true
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: The loan }
  /v2/loans:
    get:
      operationId: listLoans
      summary: List loans
      security:
        - bearer: [loans:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Loan' }
  /v2/borrowers/{borrowerId}:
    patch:
      operationId: updateBorrower
      summary: Update a borrower profile
      security:
        - bearer: [borrowers:write]
      parameters:
        - name: borrowerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                role: { type: string }
                creditLimit: { type: number }
      responses:
        '200':
          description: The borrower
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Borrower' }
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  stack: { type: string }
  /v2/refunds:
    post:
      operationId: issueRefund
      summary: Refund a repayment
      security:
        - bearer: [refunds:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                loanId: { type: string }
                amount: { type: number }
      responses:
        '201': { description: Created }
  /v2/documents/import:
    post:
      operationId: importDocument
      summary: Import a borrower document from a link
      security:
        - bearer: [documents:write]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceUrl: { type: string, format: uri }
      responses:
        '202': { description: Accepted }
  /v2/assistant/chat:
    post:
      operationId: assistantChat
      summary: Ask the loan assistant
      security:
        - bearer: [assistant:use]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                system_prompt: { type: string }
                message: { type: string }
                model: { type: string }
                email: { type: string }
      responses:
        '200':
          description: The answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer_html: { type: string }
  /v2/auth/token:
    post:
      operationId: createToken
      summary: Exchange credentials for a token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: A token }
  /v2/admin/rates:
    put:
      operationId: setRates
      summary: Change interest rates
      security:
        - bearer: [loans:read]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                apr: { type: number }
      responses:
        '204': { description: Updated }
  /v2/status:
    get:
      operationId: status
      summary: Health check
      security: []
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    partnerKey: { type: apiKey, in: query, name: api_key }
  schemas:
    Loan:
      type: object
      properties:
        id: { type: string }
        amount: { type: number }
        status: { type: string }
        borrower: { $ref: '#/components/schemas/Borrower' }
    Borrower:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ssn: { type: string }
        password_hash: { type: string }
