<!doctype html>
<html lang="en" data-radius="sharp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patchlane check-up: review an API spec, headers, tokens and agent tools</title>
<meta name="description" content="Paste an OpenAPI spec, a server response, a JWT or an MCP tool list. Patchlane ranks the risks and writes the fix for your framework, without uploading anything.">
<meta property="og:type" content="website">
<meta property="og:title" content="Patchlane check-up">
<meta property="og:description" content="Findings ranked by severity, each with fix code for Express, FastAPI, Django, Laravel or Spring. Runs in your browser.">
<meta property="og:image" content="/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body>
<a class="skip" href="#results">Skip to findings</a>
<header class="top">
  <a class="brand" href="/"><span class="brand__mark" aria-hidden="true">P</span><span>Patchlane</span></a>
  <p class="top__local"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5h7v6h-7z"/><path d="M5.75 7.5V5.25a2.25 2.25 0 0 1 4.5 0V7.5"/></svg>Runs in this tab. Nothing is uploaded.</p>
  <div class="top__actions">
    <label class="top__fw"><span class="visually-hidden">Fix code for</span><select id="framework" class="input input--sm"></select></label>
    <div class="menu" id="export-menu">
      <button type="button" class="btn btn--secondary" id="export-button" aria-haspopup="menu" aria-expanded="false" aria-controls="export-list">Export<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg></button>
      <div class="menu__list" id="export-list" role="menu" aria-label="Export the check-up" hidden></div>
    </div>
    <button type="button" class="btn btn--primary" id="load-sample">Load the sample</button>
  </div>
</header>

<div class="switch" id="view-switch" role="group" aria-label="View">
  <button type="button" data-view="inputs" aria-pressed="true">Inputs</button>
  <button type="button" data-view="findings" aria-pressed="false">Findings <span class="switch__n"></span></button>
</div>

<main class="desk" data-view="inputs">
  <aside class="inputs" aria-label="What to check">
    <div class="tabs" id="desk-tabs" role="tablist" aria-label="Inputs"></div>
    <div class="inputs__panels" id="desk-panels"></div>
    <footer class="inputs__foot">
      <label class="check check--small" for="remember"><input type="checkbox" id="remember" class="check__box"><span class="check__mark" aria-hidden="true"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="check__text"><span>Remember my inputs on this device</span><span class="check__hint">Off by default. Kept in this browser only.</span></span></label>
      <p class="inputs__links"><a href="/rules/">Every rule</a><a href="/privacy">Privacy</a><a id="repo-link" href="https://github.com/abuhuraira99/patchlane">Source</a></p>
    </footer>
  </aside>
  <section class="results" id="results" aria-label="Findings" tabindex="-1"></section>
  <section class="detail" id="detail" aria-label="Finding detail"></section>
</main>
<noscript><p class="noscript">Patchlane runs its checks with JavaScript in your browser. Turn it on for this page, or use the CLI.</p></noscript>
<script type="module" src="/src/app/main.ts"></script>
</body>
</html>
